name: Python research verification
on: [push, pull_request, workflow_dispatch]
jobs:
  public-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.19"
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      - run: uv run etf-study verify --artifacts-only
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
      - name: Verify frozen follow-up artifacts
        if: ${{ hashFiles('results/followup/verification.json') != '' }}
        run: |
          uv run python -m etf_regimes.followup_snapshot restore
          uv run etf-study followup verify --artifacts-only
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
      - name: Verify paper-first diagnostic artifacts
        if: ${{ hashFiles('results/redesign/verification.json') != '' }}
        run: |
          uv run python -m etf_regimes.redesign_snapshot restore
          uv run python -m etf_regimes.redesign_snapshot verify
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
      - name: Verify public-input method controls
        if: ${{ hashFiles('results/public_method_checks/verification.json') != '' }}
        run: uv run python -m etf_regimes.public_method_checks artifacts
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
      - name: Verify fixed AGG feature alignment
        if: ${{ hashFiles('results/paper_alignment/verification.json') != '' }}
        run: |
          uv run python -m etf_regimes.paper_alignment restore
          uv run python -m etf_regimes.paper_alignment artifacts
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
