name: Research quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:lightgbm
      - run: pnpm check
        env:
          LIGHTGBM_BIN: '${{ github.workspace }}/.cache/LightGBM/lightgbm'
      - run: pnpm verify:published
      - run: pnpm verify:power -- --public
      - run: pnpm verify:causes -- --public
