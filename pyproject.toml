[project]
name = "global-etf-regimes"
version = "0.1.0"
description = "Point-in-time comparison of asset-specific and economic regimes"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<3", "scipy>=1.14,<2",
  "scikit-learn>=1.5,<2", "xgboost==2.1.4", "cvxpy>=1.6,<2",
  "osqp>=1.0,<2", "pyarrow>=18,<30", "matplotlib>=3.9,<4",
  "curl-cffi>=0.13,<1", "pandas-market-calendars>=5,<6",
  "jumpmodels @ git+https://github.com/Yizhan-Oliver-Shu/jump-models.git@d0fa00ce10126791695a259a45c5ddd41fbced80",
]

[project.scripts]
etf-study = "etf_regimes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etf_regimes"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

