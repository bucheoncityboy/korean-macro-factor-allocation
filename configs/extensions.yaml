status: locked
scope: 'User explicitly requires P5 and P6 on 2026-10-18'
allocation:
  initial_train_after_return_feature_warmup: 84
  primary_model: Ridge
  non_macro_features: [spread_lag1, spread_mean3, spread_vol12]
  macro_features: 'all six preregistered factors added to the same three return features'
  inner_validation: 'monthly expanding, last 12 released training cases; same alpha budget for both strategies'
  mapping: 'equity_weight = 0.5 + 0.2 * tanh(forecast / training_target_sample_std)'
  constraints: { min_equity: 0.3, max_equity: 0.7, short: false, leverage: false }
  execution: 'first common ETF trading date with positive volume after decision; close; terminal valuation at next execution close'
  signal_to_execution_gap: 'old holdings retain the gap return; new weights apply only after execution'
  primary_one_way_cost_bps: 10
  cost_sensitivity_bps: [0, 5, 10, 25]
  reinvestment: 'cash distribution reinvested at ex-date close, trading cost charged; theoretical TR convention, payment delays not modeled'
  turnover: '0.5 * sum(abs(actual asset trades)) / pre-trade NAV; cost applies to full buy+sell notional'
  accounting: 'post_NAV solves post_NAV + cost * sum(abs(target_weight*post_NAV - drifted_asset_value)) = pre_NAV'
  regimes: 'continuous allocation signal, descriptive defensive/balanced/pro-risk at equity weights 0.45/0.55; no growth-inflation grid'
  uncertainty: 'paired 6-month circular block bootstrap, 5000 draws; report return, risk, exposure and turnover differences'
lightgbm:
  version: '4.6.0'
  implementation: 'official native C++ CLI; no Python wrapper'
  min_data_in_leaf: 20
  lambda_l2: 5
  learning_rate: 0.03
  max_bin: 31
  num_threads: 1
  seed: 20261018
  candidates:
    - { num_leaves: 3, max_depth: 2, num_iterations: 40 }
    - { num_leaves: 3, max_depth: 2, num_iterations: 80 }
    - { num_leaves: 5, max_depth: 3, num_iterations: 40 }
    - { num_leaves: 5, max_depth: 3, num_iterations: 80 }
  inner_validation: 'three expanding origins; consecutive 6-month validation blocks at the final 18 training months; targets available at each inner origin'
  target: SPREAD_RET
  feature_set: 'same six factors and same OOS decision months as P4'
  shap: 'native predict_contrib=true TreeSHAP; OOS contributions only, verify sum to forecast; aggregate signed group contributions before taking absolute value'
  ablations: ['remove fx_change', 'remove dollar_change']
  interpretation: 'descriptive model attribution; no causal interpretation or full-sample feature reselection'
power:
  desired_power: 0.8
  h1_effect_sizes_partial_r2: [0.02, 0.05, 0.1]
  oos_effect_sizes_r2: [0.01, 0.03, 0.05, 0.1]
  method: 'H1 noncentral chi-square design approximation with residual effective-n sensitivity; OOS standardized paired loss MDE using block-bootstrap SE'
  limitations: 'Design sensitivity is not observed post-hoc power and cannot guarantee power for small effects; reliance on asymptotic assumptions is reported'
secondary:
  cpi:
    purpose: 'Exploratory shorter-sample inflation sensitivity; never replaces primary target, factors or OOS window'
    additional_feature: { id: cpi_yoy, series_id: KR_CPI, group: domestic, transform: yoy, max_age_months: 3 }
    oos_start: 2017-08
    oos_end: 2023-10
    min_oos: 60
    models: [HistoricalMean, AR1, OLS, Ridge]
  information_lag:
    additional_months: [1]
    purpose: 'One extra eligibility month for domestic monthly macros; same fixed primary OOS and features'
